name: Build Windows (.exe)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  export-windows:
    name: Exportar para Windows
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.6.2
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar templates de exportacao
        run: |
          DEST=~/.local/share/godot/templates/3.6.2.stable
          mkdir -v -p "$DEST"
          SRC=$(find / -type f -name "windows_64_release.exe" -not -path "/proc/*" -not -path "$DEST/*" 2>/dev/null | head -1)
          echo "Template encontrado em: $SRC"
          if [ -n "$SRC" ]; then
            cp -v "$(dirname "$SRC")"/* "$DEST"/
          fi
          if [ ! -f "$DEST/windows_64_release.exe" ]; then
            echo "Nao achei na imagem, baixando templates do GitHub do Godot..."
            wget -q "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz" -O /tmp/templates.zip
            unzip -q -o /tmp/templates.zip -d /tmp/templates
            cp -v /tmp/templates/templates/* "$DEST"/
          fi
          echo "=== templates instalados ==="
          ls -la "$DEST"

      - name: Exportar .exe
        run: |
          mkdir -v -p build
          godot -v --export "Windows Desktop" build/UltimaZona.exe > export.log 2>&1 || true
          echo "=========== RESUMO DOS ERROS ==========="
          grep -v "NULL RID" export.log | grep -v "visual_server_raster" | grep -iE "error|cannot|invalid|fail|template|parse|missing|not found|export" | head -60 || true
          echo "=========== ARQUIVOS GERADOS ==========="
          ls -la build
          test -f build/UltimaZona.exe

      - name: Enviar o jogo pronto
        uses: actions/upload-artifact@v4
        with:
          name: UltimaZona-windows
          path: build
          
